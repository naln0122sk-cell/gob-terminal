<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고화질 트래킹 + 그린스크린 + 박스 내 45° 블러 + 블랙박스(불투명)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      color: #eee;
      padding: 20px;
    }
    h1 {
      margin: 10px 0;
      font-weight: 300;
      letter-spacing: 2px;
      color: #e94560;
    }
    .container {
      width: 100%;
      max-width: 960px;
      background: #0f3460;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      background: #000;
    }
    video { display: none; }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      max-height: 70vh;
      object-fit: contain;
    }
    .controls {
      padding: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      background: #16213e;
    }
    input[type="file"] {
      flex: 1; min-width: 200px;
      color: #ccc; background: #0f3460;
      border: none; padding: 8px 12px; border-radius: 6px;
      cursor: pointer;
    }
    button {
      background: #e94560;
      color: #fff; border: none;
      padding: 10px 24px; border-radius: 6px;
      font-weight: 600; cursor: pointer;
      transition: background 0.2s; white-space: nowrap;
    }
    button:hover { background: #c23152; }
    button:disabled {
      background: #555; cursor: not-allowed;
    }
    .status {
      font-size: 0.9em; color: #a0a0b0;
      margin-left: auto;
    }
    .fps { color: #f0a500; font-weight: bold; }

    .check-group {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ccc;
      font-size: 0.9em;
    }
    .check-group input[type="checkbox"] {
      width: 16px; height: 16px; cursor: pointer;
    }
    .check-group input[type="range"] {
      width: 100px; cursor: pointer;
    }
    @media (max-width: 600px) {
      .controls { flex-direction: column; align-items: stretch; }
      .check-group { justify-content: space-between; }
    }
  </style>
</head>
<body>
  <h1>🎥 고화질 트래킹 + 그린스크린 + 박스 내 45° 블러</h1>
  <div class="container">
    <div class="video-wrapper">
      <video id="video" crossorigin="anonymous" playsinline muted loop></video>
      <canvas id="canvas"></canvas>
    </div>
    <div class="controls">
      <input type="file" id="fileInput" accept="video/*" title="동영상 파일 선택">
      <button id="detectBtn" disabled>객체 감지 시작</button>
      <button id="renderBtn" disabled>렌더링 (MP4 다운로드)</button>
      <label class="check-group">
        <input type="checkbox" id="greenScreenCheck"> 그린스크린
      </label>
      <label class="check-group">
        <input type="checkbox" id="blur45Check"> 45° 가우시안 블러
      </label>
      <label class="check-group">
        강도: <input type="range" id="blurRadius" min="1" max="15" value="5" step="0.5">
      </label>
      <label class="check-group">
        <input type="checkbox" id="blackBoxCheck"> 블랙 박스
      </label>
      <span class="status" id="status">모델 로딩 중...</span>
      <span class="fps" id="fps"></span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/umd/ffmpeg.js"></script>
  <script>
    const ffmpegCorePath = 'https://unpkg.com/@ffmpeg/core@0.12.2/dist/umd/ffmpeg-core.js';
  </script>

  <script>
    (() => {
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const fileInput = document.getElementById('fileInput');
      const detectBtn = document.getElementById('detectBtn');
      const renderBtn = document.getElementById('renderBtn');
      const greenCheck = document.getElementById('greenScreenCheck');
      const blurCheck = document.getElementById('blur45Check');
      const blurRadiusInput = document.getElementById('blurRadius');
      const blackBoxCheck = document.getElementById('blackBoxCheck');
      const statusDiv = document.getElementById('status');
      const fpsSpan = document.getElementById('fps');

      let model = null;
      let detectionActive = false;
      let videoReady = false;
      let lastFrameTime = performance.now();
      let frameCount = 0;

      let mediaRecorder = null;
      let recordedChunks = [];
      let rendering = false;
      let ffmpeg = null;
      let ffmpegLoaded = false;
      let progressHandler = null;
      let wasLoop = true;

      let greenScreenMode = false;
      let blur45Mode = false;
      let blurRadius = 5.0;
      let blackBoxMode = false;

      // 오프스크린 캔버스들 (블러 연산용)
      let blurOffscreen = null;   // 방향 블러 내부에서 사용하는 복사본
      let blurAccum = null;       // 방향 블러 누적 캔버스
      let blurTemp = null;        // 박스 내 블러 적용용 임시 캔버스

      // 체크박스 이벤트
      greenCheck.addEventListener('change', (e) => {
        greenScreenMode = e.target.checked;
      });
      blurCheck.addEventListener('change', (e) => {
        blur45Mode = e.target.checked;
      });
      blurRadiusInput.addEventListener('input', (e) => {
        blurRadius = parseFloat(e.target.value);
      });
      blackBoxCheck.addEventListener('change', (e) => {
        blackBoxMode = e.target.checked;
      });

      // 모델 로드
      (async () => {
        statusDiv.textContent = 'COCO-SSD 모델 로딩 중...';
        try {
          model = await cocoSsd.load();
          statusDiv.textContent = '모델 준비 완료. 동영상을 선택하세요.';
        } catch (err) {
          statusDiv.textContent = '모델 로드 실패.';
          console.error(err);
        }
      })();

      // 비디오 파일 로드
      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        resetPipeline();
        const url = URL.createObjectURL(file);
        video.src = url;
        video.load();
        videoReady = false;
        detectBtn.disabled = true;
        renderBtn.disabled = true;
        statusDiv.textContent = '동영상 로딩 중...';

        video.onloadedmetadata = () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          videoReady = true;
          // 캔버스 초기화
          blurOffscreen = null;
          blurAccum = null;
          blurTemp = null;
          if (model) {
            detectBtn.disabled = false;
            statusDiv.textContent = '동영상 준비 완료. 감지를 시작하세요.';
          } else {
            statusDiv.textContent = '모델 로딩을 기다리는 중...';
          }
        };
        video.onerror = () => {
          statusDiv.textContent = '동영상을 불러올 수 없습니다.';
          videoReady = false;
          detectBtn.disabled = true;
          renderBtn.disabled = true;
        };
      });

      // 감지 시작/중지
      detectBtn.addEventListener('click', () => {
        if (!model || !videoReady) return;
        if (detectionActive) {
          stopDetection();
          detectBtn.textContent = '객체 감지 시작';
          statusDiv.textContent = '감지 중지됨.';
          renderBtn.disabled = true;
        } else {
          startDetection();
          detectBtn.textContent = '객체 감지 중지';
          statusDiv.textContent = '실시간 감지 중...';
          renderBtn.disabled = false;
        }
      });

      function startDetection() {
        if (detectionActive) return;
        detectionActive = true;
        if (video.paused) video.play();
        detectFrame();
      }

      function stopDetection() {
        detectionActive = false;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        fpsSpan.textContent = '';
        frameCount = 0;
        renderBtn.disabled = true;
      }

      // 실시간 감지 + 선택적 박스 내 블러 적용
      async function detectFrame() {
        if (!detectionActive || !model || video.ended) {
          if (detectionActive) requestAnimationFrame(detectFrame);
          return;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 배경: 그린스크린 or 영상
        if (greenScreenMode) {
          ctx.fillStyle = '#00FF00';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        } else {
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        }

        let predictions = [];
        try {
          predictions = await model.detect(video);

          // 박스 그리기 (흰색 or 검정)
          if (blackBoxMode) {
            drawBlackBoxes(predictions);
          } else {
            drawWhiteBoxes(predictions);
          }

          // 가우시안 블러를 박스 내부에만 적용 (블랙박스 모드 제외)
          if (blur45Mode && !blackBoxMode && predictions.length > 0 && canvas.width > 0 && canvas.height > 0) {
            applyBlurInsideBoxes(predictions, blurRadius);
          }

          frameCount++;
          const now = performance.now();
          if (frameCount % 10 === 0) {
            const fps = (10 / ((now - lastFrameTime) / 1000)).toFixed(1);
            fpsSpan.textContent = `${fps} FPS`;
            lastFrameTime = now;
          }
        } catch (err) {
          console.error('감지 오류:', err);
        }

        requestAnimationFrame(detectFrame);
      }

      // 흰색 박스 그리기
      function drawWhiteBoxes(predictions) {
        if (video.videoWidth === 0 || video.videoHeight === 0) return;
        for (const pred of predictions) {
          const [x, y, w, h] = pred.bbox;
          const randomNum = Math.floor(Math.random() * 10000);
          const text = `${randomNum}`;

          ctx.strokeStyle = 'white';
          ctx.lineWidth = Math.max(2, video.videoWidth / 400);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
          ctx.beginPath();
          ctx.rect(x, y, w, h);
          ctx.fill();
          ctx.stroke();

          const fontSize = Math.max(12, video.videoHeight / 40);
          ctx.font = `bold ${fontSize}px "Segoe UI", sans-serif`;
          const textMetrics = ctx.measureText(text);
          const textHeight = fontSize + 4;
          ctx.fillStyle = 'white';
          ctx.fillRect(x, y - textHeight - 2, textMetrics.width + 8, textHeight + 4);
          ctx.fillStyle = 'black';
          ctx.fillText(text, x + 4, y - 6);
        }
      }

      // 블랙 박스 그리기 (불투명 검정)
      function drawBlackBoxes(predictions) {
        if (video.videoWidth === 0 || video.videoHeight === 0) return;
        for (const pred of predictions) {
          const [x, y, w, h] = pred.bbox;
          const randomNum = Math.floor(Math.random() * 10000);
          const text = `${randomNum}`;

          ctx.strokeStyle = 'black';
          ctx.lineWidth = Math.max(2, video.videoWidth / 400);
          ctx.fillStyle = 'black';  // 불투명 검정
          ctx.beginPath();
          ctx.rect(x, y, w, h);
          ctx.fill();
          ctx.stroke();

          const fontSize = Math.max(12, video.videoHeight / 40);
          ctx.font = `bold ${fontSize}px "Segoe UI", sans-serif`;
          const textMetrics = ctx.measureText(text);
          const textHeight = fontSize + 4;
          ctx.fillStyle = 'black';
          ctx.fillRect(x, y - textHeight - 2, textMetrics.width + 8, textHeight + 4);
          ctx.fillStyle = 'white';
          ctx.fillText(text, x + 4, y - 6);
        }
      }

      // 박스 영역 내에만 방향성 가우시안 블러 적용
      function applyBlurInsideBoxes(boxes, sigma) {
        if (boxes.length === 0) return;
        const w = canvas.width;
        const h = canvas.height;
        if (w === 0 || h === 0) return;

        // 1. 현재 캔버스 내용을 임시 캔버스에 복사
        if (!blurTemp || blurTemp.width !== w || blurTemp.height !== h) {
          blurTemp = document.createElement('canvas');
          blurTemp.width = w;
          blurTemp.height = h;
        }
        const tempCtx = blurTemp.getContext('2d');
        tempCtx.clearRect(0, 0, w, h);
        tempCtx.drawImage(canvas, 0, 0);

        // 2. 임시 캔버스 전체에 45도 블러 적용 (기존 함수 재사용)
        applyDirectionalGaussianBlur(blurTemp, 45, sigma);

        // 3. 블러된 임시 캔버스에서 각 박스 영역만 메인 캔버스에 덮어쓰기
        ctx.save();
        ctx.beginPath();
        for (const pred of boxes) {
          const [x, y, w, h] = pred.bbox;
          ctx.rect(x, y, w, h);
        }
        ctx.clip(); // 박스 영역으로 클리핑
        ctx.drawImage(blurTemp, 0, 0);
        ctx.restore();
      }

      // 45도 방향 가우시안 블러 (대상 캔버스 전체를 덮어씀)
      function applyDirectionalGaussianBlur(targetCanvas, angleDeg, sigma) {
        const w = targetCanvas.width;
        const h = targetCanvas.height;
        if (w === 0 || h === 0) return;

        const angle = angleDeg * Math.PI / 180;
        const dx = Math.cos(angle);
        const dy = Math.sin(angle);

        const maxOffset = Math.ceil(3 * sigma);
        const offsets = [];
        let totalWeight = 0;
        for (let i = -maxOffset; i <= maxOffset; i++) {
          const weight = Math.exp(-0.5 * (i * i) / (sigma * sigma));
          offsets.push({ offset: i, weight });
          totalWeight += weight;
        }

        // 내부 연산용 오프스크린 캔버스 준비
        if (!blurOffscreen || blurOffscreen.width !== w || blurOffscreen.height !== h) {
          blurOffscreen = document.createElement('canvas');
          blurOffscreen.width = w;
          blurOffscreen.height = h;
        }
        if (!blurAccum || blurAccum.width !== w || blurAccum.height !== h) {
          blurAccum = document.createElement('canvas');
          blurAccum.width = w;
          blurAccum.height = h;
        }

        const offCtx = blurOffscreen.getContext('2d');
        const accumCtx = blurAccum.getContext('2d');

        offCtx.clearRect(0, 0, w, h);
        offCtx.drawImage(targetCanvas, 0, 0);

        accumCtx.globalCompositeOperation = 'source-over';
        accumCtx.fillStyle = 'black';
        accumCtx.fillRect(0, 0, w, h);

        accumCtx.globalCompositeOperation = 'lighter';
        for (const { offset, weight } of offsets) {
          accumCtx.globalAlpha = weight;
          accumCtx.drawImage(blurOffscreen, dx * offset, dy * offset);
        }

        const ctx = targetCanvas.getContext('2d');
        ctx.clearRect(0, 0, w, h);
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1 / totalWeight;
        ctx.drawImage(blurAccum, 0, 0);
        ctx.globalAlpha = 1.0;
        accumCtx.globalCompositeOperation = 'source-over';
      }

      // ffmpeg.wasm 초기화
      async function initFFmpeg() {
        if (ffmpegLoaded) return;
        statusDiv.textContent = 'ffmpeg.wasm 로딩 중...';
        ffmpeg = FFmpegWASM.createFFmpeg({ corePath: ffmpegCorePath, log: false });
        await ffmpeg.load();
        ffmpegLoaded = true;
        statusDiv.textContent = '렌더링 준비 완료.';
      }

      // 렌더링
      renderBtn.addEventListener('click', () => {
        if (!detectionActive || rendering) return;
        startRender();
      });

      function updateProgress() {
        if (!rendering || !video.duration || video.duration === Infinity) return;
        const pct = Math.min(100, (video.currentTime / video.duration) * 100).toFixed(1);
        statusDiv.textContent = `렌더링 중... ${pct}%`;
      }

      async function startRender() {
        if (!videoReady || rendering) return;
        if (video.readyState < 2) {
          alert('동영상이 아직 로드되지 않았습니다.');
          return;
        }

        rendering = true;
        renderBtn.disabled = true;
        detectBtn.disabled = true;
        recordedChunks = [];

        wasLoop = video.loop;
        video.loop = false;  // 한 번만 재생

        statusDiv.textContent = '렌더링 준비 중...';

        progressHandler = () => {
          updateProgress();
          if (video.duration && !isNaN(video.duration) && video.currentTime >= video.duration - 0.1) {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
              mediaRecorder.stop();
            }
          }
        };
        video.addEventListener('timeupdate', progressHandler);

        const canvasStream = canvas.captureStream(60);
        const videoTrack = canvasStream.getVideoTracks()[0];

        let combinedStream;
        if (!greenScreenMode) {
          try {
            const videoStream = video.captureStream();
            const audioTracks = videoStream.getAudioTracks();
            combinedStream = new MediaStream([videoTrack, ...audioTracks]);
          } catch (e) {
            combinedStream = new MediaStream([videoTrack]);
          }
        } else {
          combinedStream = new MediaStream([videoTrack]);
        }

        const mimeType = 'video/webm; codecs="vp9"';
        const options = {
          mimeType,
          videoBitsPerSecond: 16000000
        };

        mediaRecorder = new MediaRecorder(combinedStream, options);

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
          video.removeEventListener('timeupdate', progressHandler);
          progressHandler = null;

          const blob = new Blob(recordedChunks, { type: mimeType });
          const filename = `tracking_${greenScreenMode ? 'greenscreen' : 'normal'}${blur45Mode ? '_blur45' : ''}${blackBoxMode ? '_blackbox' : ''}.webm`;
          downloadFile(blob, filename);
          finishRender();
        };

        const onEnded = () => {
          video.removeEventListener('ended', onEnded);
          if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
          }
        };
        video.addEventListener('ended', onEnded);

        video.currentTime = 0;
        video.play();
        updateProgress();

        mediaRecorder.start();
      }

      function finishRender() {
        rendering = false;
        video.pause();
        video.loop = wasLoop;
        renderBtn.disabled = false;
        detectBtn.disabled = false;
        statusDiv.textContent = '렌더링 완료 (원본 길이)';
      }

      function downloadFile(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function resetPipeline() {
        stopDetection();
        abortRender();
        if (video.src.startsWith('blob:')) URL.revokeObjectURL(video.src);
      }

      function abortRender() {
        if (rendering) {
          if (progressHandler) {
            video.removeEventListener('timeupdate', progressHandler);
            progressHandler = null;
          }
          if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
          }
          rendering = false;
          video.loop = wasLoop;
          renderBtn.disabled = false;
          detectBtn.disabled = false;
          statusDiv.textContent = '렌더링 취소됨.';
        }
      }

      // 드래그 앤 드롭
      const videoWrapper = document.querySelector('.video-wrapper');
      videoWrapper.addEventListener('dragover', (e) => {
        e.preventDefault();
        videoWrapper.style.opacity = '0.8';
      });
      videoWrapper.addEventListener('dragleave', (e) => {
        e.preventDefault();
        videoWrapper.style.opacity = '1';
      });
      videoWrapper.addEventListener('drop', (e) => {
        e.preventDefault();
        videoWrapper.style.opacity = '1';
        const files = e.dataTransfer.files;
        if (files.length > 0 && files[0].type.startsWith('video/')) {
          const dt = new DataTransfer();
          dt.items.add(files[0]);
          fileInput.files = dt.files;
          fileInput.dispatchEvent(new Event('change'));
        }
      });

      window.addEventListener('beforeunload', () => {
        resetPipeline();
      });
    })();
  </script>
</body>
</html>
